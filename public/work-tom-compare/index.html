<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Demo A vs Demo B</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  .bar { height: 48px; display: flex; align-items: center; justify-content: center; gap: 20px; background: #111; border-bottom: 1px solid rgba(255,255,255,0.08); position: relative; }
  .bar h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
  .switch { display: flex; gap: 6px; background: rgba(255,255,255,0.06); padding: 3px; border-radius: 999px; }
  .switch button { background: transparent; border: none; color: rgba(255,255,255,0.6); padding: 4px 14px; font-size: 12px; border-radius: 999px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .switch button.active { background: #fff; color: #111; font-weight: 600; }
  .back { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; }
  .back:hover { color: #fff; }
  iframe { width: 100%; height: calc(100% - 48px); border: none; background: #fff; display: block; }
</style>
</head>
<body>
  <div class="bar">
    <a href="/#ai-capabilities" class="back">← 返回</a>
    <h1>Demo A vs Demo B</h1>
    <div class="switch">
      <button id="btnA" class="active" onclick="showA()">Demo A</button>
      <button id="btnB" onclick="showB()">Demo B</button>
    </div>
  </div>
  <iframe id="frame" src="/work-tom-landing/index.html"></iframe>
  <script>
    function showA() {
      document.getElementById('frame').src = '/work-tom-landing/index.html';
      document.getElementById('btnA').classList.add('active');
      document.getElementById('btnB').classList.remove('active');
    }
    function showB() {
      document.getElementById('frame').src = '/work-tom-landing-b/index.html';
      document.getElementById('btnB').classList.add('active');
      document.getElementById('btnA').classList.remove('active');
    }
  </script>
</body>
</html>
